name: Release

# Push an annotated tag like v0.3.2 that matches manifest.json; its message becomes the release notes and the
# tested build is published as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches manifest version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./manifest.json").version')"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Source archive
        run: git archive --format=zip --prefix="bw-lite-${GITHUB_REF_NAME#v}-source/" -o "dist/bw-lite-${GITHUB_REF_NAME#v}-source.zip" HEAD
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" # checkout drops the tag's annotation
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "BW Lite ${GITHUB_REF_NAME#v}" --notes-from-tag --verify-tag
